# Perfil de memoria de partida para la A275 (estado "A" de los experimentos).
# Se instala en /etc/sysctl.d/. Cada valor es un punto de arranque a medir, no una
# conclusión. Ver docs/plan-rendimiento-por-vatio.md, sección 4.

# Con zswap el swap "cercano" está en RAM: conviene que el kernel prefiera mandar
# páginas anónimas frías a comprimir antes que tirar caché de ficheros.
# Rango 0-200. Probar 100 frente a 150.
vm.swappiness = 100

# Sin lectura anticipada de swap: con zswap/zram leer de más solo gasta ciclos.
vm.page-cluster = 0

# Menos reclamo "por si acaso" y sin picos de watermark tras compactar.
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# Escrituras al SSD: lotes grandes pero acotados en bytes (independiente de la RAM).
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_expire_centisecs = 3000
vm.dirty_writeback_centisecs = 1500

# Compactación proactiva baja: evita que el kernel queme ciclos reordenando memoria.
vm.compaction_proactiveness = 5

# Mantener dentries/inodes en caché un poco más (arranque de apps).
vm.vfs_cache_pressure = 50
