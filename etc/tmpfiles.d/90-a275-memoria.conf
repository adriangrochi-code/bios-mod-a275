# Ajustes de sysfs al arrancar (systemd-tmpfiles). Estado "A" de los experimentos.
# Formato: w = escribir el valor; '-' = sin modo/propietario.
# Ver docs/plan-rendimiento-por-vatio.md, sección 4.

# zswap: lz4 en RAM, pool hasta el 25 % de la RAM, shrinker activo
w /sys/module/zswap/parameters/enabled            - - - - Y
w /sys/module/zswap/parameters/compressor         - - - - lz4
w /sys/module/zswap/parameters/zpool              - - - - zsmalloc
w /sys/module/zswap/parameters/max_pool_percent   - - - - 25
w /sys/module/zswap/parameters/accept_threshold_percent - - - - 90
w /sys/module/zswap/parameters/shrinker_enabled   - - - - Y

# MGLRU activo; min_ttl_ms corta el thrashing si el conjunto de trabajo no cabe
w /sys/kernel/mm/lru_gen/enabled                  - - - - y
w /sys/kernel/mm/lru_gen/min_ttl_ms               - - - - 1000

# KSM en marcha, con smart scan y poco agresivo (las apps lo activan por prctl)
w /sys/kernel/mm/ksm/run                          - - - - 1
w /sys/kernel/mm/ksm/smart_scan                   - - - - 1
w /sys/kernel/mm/ksm/sleep_millisecs              - - - - 200
w /sys/kernel/mm/ksm/pages_to_scan                - - - - 100

# Huge pages solo cuando la app las pide
w /sys/kernel/mm/transparent_hugepage/enabled     - - - - madvise
w /sys/kernel/mm/transparent_hugepage/defrag      - - - - madvise

# CPU: governor de reposo teo y schedutil con reacción moderada
w /sys/devices/system/cpu/cpuidle/current_governor - - - - teo
w /sys/devices/system/cpu/cpufreq/boost            - - - - 1
